<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Announcement Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Default initial data setup
        const initialUsers = [
          { id: '1', name: 'Admin User', email: 'admin@example.com', role: 'admin', password: 'password' },
          { id: '2', name: 'John Doe', email: 'user@example.com', role: 'user', password: 'password' }
        ];

        const initialTasks = [
          { id: 't1', title: 'Complete Quarterly Report', description: 'Prepare and review financial summary for Q3.', assignedTo: '2', assignedName: 'John Doe', status: 'In Progress', priority: 'High', dueDate: '2026-11-15' },
          { id: 't2', title: 'Update Profile Settings', description: 'Ensure all personal information is up to date.', assignedTo: '2', assignedName: 'John Doe', status: 'Pending', priority: 'Medium', dueDate: '2026-11-20' }
        ];

        const initialAnnouncements = [
          { id: 'a1', title: 'Scheduled System Maintenance', content: 'The system will undergo brief maintenance this Sunday at midnight UTC.', date: '2026-11-02', priority: 'High' },
          { id: 'a2', title: 'Welcome to the New Platform!', content: 'Explore your dashboard to view assigned tasks and company updates.', date: '2026-11-01', priority: 'Normal' }
        ];

        function App() {
          const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('app_users')) || initialUsers);
          const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('app_tasks')) || initialTasks);
          const [announcements, setAnnouncements] = useState(() => JSON.parse(localStorage.getItem('app_announcements')) || initialAnnouncements);
          const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('app_current_user')) || null);

          const [authMode, setAuthMode] = useState('login');
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [name, setName] = useState('');
          const [role, setRole] = useState('user');
          const [authError, setAuthError] = useState('');

          const [activeTab, setActiveTab] = useState('tasks');
          
          // Task Creation Form State
          const [newTaskTitle, setNewTaskTitle] = useState('');
          const [newTaskDesc, setNewTaskDesc] = useState('');
          const [newTaskAssignee, setNewTaskAssignee] = useState('');
          const [newTaskPriority, setNewTaskPriority] = useState('Medium');
          const [newTaskDueDate, setNewTaskDueDate] = useState('');

          // Announcement Creation Form State
          const [newAnnTitle, setNewAnnTitle] = useState('');
          const [newAnnContent, setNewAnnContent] = useState('');
          const [newAnnPriority, setNewAnnPriority] = useState('Normal');

          useEffect(() => { localStorage.setItem('app_users', JSON.stringify(users)); }, [users]);
          useEffect(() => { localStorage.setItem('app_tasks', JSON.stringify(tasks)); }, [tasks]);
          useEffect(() => { localStorage.setItem('app_announcements', JSON.stringify(announcements)); }, [announcements]);
          useEffect(() => { 
            if (currentUser) localStorage.setItem('app_current_user', JSON.stringify(currentUser));
            else localStorage.removeItem('app_current_user');
          }, [currentUser]);

          const handleSignup = (e) => {
            e.preventDefault();
            if (!email || !password || !name) {
              setAuthError('Please fill in all required fields.');
              return;
            }
            if (users.find(u => u.email === email)) {
              setAuthError('An account with this email already exists.');
              return;
            }
            const newUser = { id: Date.now().toString(), name, email, role, password };
            setUsers([...users, newUser]);
            setCurrentUser(newUser);
            setAuthError('');
          };

          const handleLogin = (e) => {
            e.preventDefault();
            const foundUser = users.find(u => u.email === email && u.password === password);
            if (foundUser) {
              setCurrentUser(foundUser);
              setAuthError('');
            } else {
              setAuthError('Invalid email or password.');
            }
          };

          const handleLogout = () => {
            setCurrentUser(null);
            setEmail('');
            setPassword('');
          };

          const handleCreateTask = (e) => {
            e.preventDefault();
            if (!newTaskTitle || !newTaskAssignee) return;
            const targetUser = users.find(u => u.id === newTaskAssignee);
            const newTask = {
              id: 't_' + Date.now(),
              title: newTaskTitle,
              description: newTaskDesc,
              assignedTo: newTaskAssignee,
              assignedName: targetUser ? targetUser.name : 'Unassigned',
              status: 'Pending',
              priority: newTaskPriority,
              dueDate: newTaskDueDate || 'Not set'
            };
            setTasks([newTask, ...tasks]);
            setNewTaskTitle('');
            setNewTaskDesc('');
            setNewTaskAssignee('');
            setNewTaskPriority('Medium');
            setNewTaskDueDate('');
          };

          const handleUpdateTaskStatus = (taskId, newStatus) => {
            setTasks(tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
          };

          const handleDeleteTask = (taskId) => {
            setTasks(tasks.filter(t => t.id !== taskId));
          };

          const handleCreateAnnouncement = (e) => {
            e.preventDefault();
            if (!newAnnTitle || !newAnnContent) return;
            const newAnn = {
              id: 'a_' + Date.now(),
              title: newAnnTitle,
              content: newAnnContent,
              priority: newAnnPriority,
              date: new Date().toISOString().split('T')[0]
            };
            setAnnouncements([newAnn, ...announcements]);
            setNewAnnTitle('');
            setNewAnnContent('');
            setNewAnnPriority('Normal');
          };

          const handleDeleteAnnouncement = (annId) => {
            setAnnouncements(announcements.filter(a => a.id !== annId));
          };

          if (!currentUser) {
            return (
              <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-blue-50">
                <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
                  <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-200">
                      ⚡
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900">Task & Notice Hub</h2>
                    <p class="text-sm text-gray-500 mt-1">
                      {authMode === 'login' ? 'Sign in to access your dashboard' : 'Create an account to get started'}
                    </p>
                  </div>

                  {authError && (
                    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg text-center">
                      {authError}
                    </div>
                  )}

                  <form onSubmit={authMode === 'login' ? handleLogin : handleSignup} class="space-y-4">
                    {authMode === 'signup' && (
                      <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                        <input
                          type="text"
                          required
                          value={name}
                          onChange={(e) => setName(e.target.value)}
                          placeholder="Jane Doe"
                          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition"
                        />
                      </div>
                    )}

                    <div>
                      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="you@example.com"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition"
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                      <input
                        type="password"
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="••••••••"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition"
                      />
                    </div>

                    {authMode === 'signup' && (
                      <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Role</label>
                        <select
                          value={role}
                          onChange={(e) => setRole(e.target.value)}
                          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white"
                        >
                          <option value="user">User (View & update tasks)</option>
                          <option value="admin">Admin (Manage tasks & notices)</option>
                        </select>
                      </div>
                    )}

                    <button
                      type="submit"
                      class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition duration-200 text-sm"
                    >
                      {authMode === 'login' ? 'Sign In' : 'Create Account'}
                    </button>
                  </form>

                  <div class="mt-6 text-center text-xs text-gray-500">
                    {authMode === 'login' ? (
                      <p>
                        Don't have an account?{' '}
                        <button onClick={() => { setAuthMode('signup'); setAuthError(''); }} class="text-indigo-600 font-semibold hover:underline">
                          Sign Up
                        </button>
                      </p>
                    ) : (
                      <p>
                        Already have an account?{' '}
                        <button onClick={() => { setAuthMode('login'); setAuthError(''); }} class="text-indigo-600 font-semibold hover:underline">
                          Sign In
                        </button>
                      </p>
                    )}
                  </div>

                  <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                    <p class="font-semibold text-gray-500 mb-1">Demo Credentials:</p>
                    <p>Admin: <code class="bg-gray-100 px-1 py-0.5 rounded">admin@example.com</code> / <code class="bg-gray-100 px-1 py-0.5 rounded">password</code></p>
                    <p>User: <code class="bg-gray-100 px-1 py-0.5 rounded">user@example.com</code> / <code class="bg-gray-100 px-1 py-0.5 rounded">password</code></p>
                  </div>
                </div>
              </div>
            );
          }

          const userTasks = currentUser.role === 'admin' 
            ? tasks 
            : tasks.filter(t => t.assignedTo === currentUser.id);

          return (
            <div class="min-h-screen bg-gray-50 flex flex-col">
              {/* Header */}
              <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">
                      ⚡
                    </div>
                    <div>
                      <h1 class="text-lg font-bold text-gray-900 leading-none">Task Hub</h1>
                      <span class="text-xs text-gray-500 font-medium capitalize">{currentUser.role} Dashboard</span>
                    </div>
                  </div>

                  <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                      <p class="text-sm font-semibold text-gray-800">{currentUser.name}</p>
                      <p class="text-xs text-gray-500">{currentUser.email}</p>
                    </div>
                    <button
                      onClick={handleLogout}
                      class="px-3 py-1.5 border border-gray-300 text-gray-700 hover:bg-gray-100 rounded-lg text-xs font-medium transition"
                    >
                      Logout
                    </button>
                  </div>
                </div>
              </header>

              {/* Main Workspace */}
              <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                {/* Navigation Tabs */}
                <div class="flex border-b border-gray-200 mb-6 space-x-8">
                  <button
                    onClick={() => setActiveTab('tasks')}
                    class={`pb-3 text-sm font-medium transition border-b-2 ${
                      activeTab === 'tasks'
                        ? 'border-indigo-600 text-indigo-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    Tasks ({userTasks.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('announcements')}
                    class={`pb-3 text-sm font-medium transition border-b-2 ${
                      activeTab === 'announcements'
                        ? 'border-indigo-600 text-indigo-600'
                        : 'border-transparent text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    Announcements ({announcements.length})
                  </button>
                  {currentUser.role === 'admin' && (
                    <button
                      onClick={() => setActiveTab('users')}
                      class={`pb-3 text-sm font-medium transition border-b-2 ${
                        activeTab === 'users'
                          ? 'border-indigo-600 text-indigo-600'
                          : 'border-transparent text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      Users Directory ({users.length})
                    </button>
                  )}
                </div>

                {/* TASKS TAB */}
                {activeTab === 'tasks' && (
                  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    {/* Task List */}
                    <div class={currentUser.role === 'admin' ? 'lg:col-span-2' : 'lg:col-span-3'}>
                      <div class="space-y-4">
                        {userTasks.length === 0 ? (
                          <div class="bg-white rounded-xl border border-dashed border-gray-300 p-8 text-center">
                            <p class="text-gray-500 text-sm">No tasks assigned yet.</p>
                          </div>
                        ) : (
                          userTasks.map(task => (
                            <div key={task.id} class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:shadow transition">
                              <div class="flex items-start justify-between">
                                <div>
                                  <div class="flex items-center space-x-2">
                                    <span class={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                                      task.priority === 'High' ? 'bg-red-100 text-red-700' :
                                      task.priority === 'Medium' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
                                    }`}>
                                      {task.priority} Priority
                                    </span>
                                    <span class={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                                      task.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' :
                                      task.status === 'In Progress' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-700'
                                    }`}>
                                      {task.status}
                                    </span>
                                  </div>
                                  <h3 class="font-semibold text-gray-900 mt-2">{task.title}</h3>
                                  <p class="text-sm text-gray-600 mt-1">{task.description}</p>
                                </div>
                                {currentUser.role === 'admin' && (
                                  <button
                                    onClick={() => handleDeleteTask(task.id)}
                                    class="text-gray-400 hover:text-red-600 text-xs font-semibold p-1"
                                  >
                                    Delete
                                  </button>
                                )}
                              </div>

                              <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                                <span>Assigned to: <strong class="text-gray-700">{task.assignedName}</strong></span>
                                <span>Due: <strong class="text-gray-700">{task.dueDate}</strong></span>
                              </div>

                              {/* Status Update Control */}
                              <div class="mt-3 flex items-center space-x-2">
                                <span class="text-xs font-medium text-gray-500">Status:</span>
                                {['Pending', 'In Progress', 'Completed'].map(st => (
                                  <button
                                    key={st}
                                    onClick={() => handleUpdateTaskStatus(task.id, st)}
                                    class={`px-2.5 py-1 text-xs rounded-md transition ${
                                      task.status === st 
                                        ? 'bg-gray-800 text-white font-medium' 
                                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                  >
                                    {st}
                                  </button>
                                ))}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    {/* Admin Create Task Panel */}
                    {currentUser.role === 'admin' && (
                      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                        <h3 class="text-base font-bold text-gray-900 mb-4">Create New Task</h3>
                        <form onSubmit={handleCreateTask} class="space-y-4">
                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Title</label>
                            <input
                              type="text"
                              required
                              value={newTaskTitle}
                              onChange={(e) => setNewTaskTitle(e.target.value)}
                              placeholder="Task heading"
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none"
                            />
                          </div>

                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
                            <textarea
                              rows="3"
                              value={newTaskDesc}
                              onChange={(e) => setNewTaskDesc(e.target.value)}
                              placeholder="Provide details..."
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none"
                            ></textarea>
                          </div>

                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Assign To</label>
                            <select
                              required
                              value={newTaskAssignee}
                              onChange={(e) => setNewTaskAssignee(e.target.value)}
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-white outline-none"
                            >
                              <option value="">Select a user...</option>
                              {users.map(u => (
                                <option key={u.id} value={u.id}>{u.name} ({u.role})</option>
                              ))}
                            </select>
                          </div>

                          <div class="grid grid-cols-2 gap-3">
                            <div>
                              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Priority</label>
                              <select
                                value={newTaskPriority}
                                onChange={(e) => setNewTaskPriority(e.target.value)}
                                class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-white outline-none"
                              >
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                              </select>
                            </div>
                            <div>
                              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Due Date</label>
                              <input
                                type="date"
                                value={newTaskDueDate}
                                onChange={(e) => setNewTaskDueDate(e.target.value)}
                                class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none"
                              />
                            </div>
                          </div>

                          <button
                            type="submit"
                            class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition"
                          >
                            Assign Task
                          </button>
                        </form>
                      </div>
                    )}
                  </div>
                )}

                {/* ANNOUNCEMENTS TAB */}
                {activeTab === 'announcements' && (
                  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class={currentUser.role === 'admin' ? 'lg:col-span-2' : 'lg:col-span-3'}>
                      <div class="space-y-4">
                        {announcements.length === 0 ? (
                          <div class="bg-white rounded-xl border border-dashed border-gray-300 p-8 text-center">
                            <p class="text-gray-500 text-sm">No announcements published.</p>
                          </div>
                        ) : (
                          announcements.map(ann => (
                            <div key={ann.id} class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                              <div class="flex items-start justify-between">
                                <div class="flex items-center space-x-2">
                                  <span class={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                                    ann.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                                  }`}>
                                    {ann.priority} Priority
                                  </span>
                                  <span class="text-xs text-gray-400">{ann.date}</span>
                                </div>
                                {currentUser.role === 'admin' && (
                                  <button
                                    onClick={() => handleDeleteAnnouncement(ann.id)}
                                    class="text-gray-400 hover:text-red-600 text-xs font-semibold"
                                  >
                                    Remove
                                  </button>
                                )}
                              </div>
                              <h3 class="text-base font-bold text-gray-900 mt-2">{ann.title}</h3>
                              <p class="text-sm text-gray-600 mt-1 leading-relaxed">{ann.content}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    {currentUser.role === 'admin' && (
                      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                        <h3 class="text-base font-bold text-gray-900 mb-4">Post Announcement</h3>
                        <form onSubmit={handleCreateAnnouncement} class="space-y-4">
                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Headline</label>
                            <input
                              type="text"
                              required
                              value={newAnnTitle}
                              onChange={(e) => setNewAnnTitle(e.target.value)}
                              placeholder="Notice title..."
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none"
                            />
                          </div>

                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Content</label>
                            <textarea
                              rows="4"
                              required
                              value={newAnnContent}
                              onChange={(e) => setNewAnnContent(e.target.value)}
                              placeholder="Write announcement text..."
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none"
                            ></textarea>
                          </div>

                          <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Priority</label>
                            <select
                              value={newAnnPriority}
                              onChange={(e) => setNewAnnPriority(e.target.value)}
                              class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-white outline-none"
                            >
                              <option value="Normal">Normal</option>
                              <option value="High">High Urgent</option>
                            </select>
                          </div>

                          <button
                            type="submit"
                            class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition"
                          >
                            Publish Notice
                          </button>
                        </form>
                      </div>
                    )}
                  </div>
                )}

                {/* USERS TAB (ADMIN ONLY) */}
                {activeTab === 'users' && currentUser.role === 'admin' && (
                  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left text-sm">
                      <thead class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase">
                        <tr>
                          <th class="px-6 py-3">Name</th>
                          <th class="px-6 py-3">Email</th>
                          <th class="px-6 py-3">Role</th>
                          <th class="px-6 py-3">Assigned Tasks</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-gray-200">
                        {users.map(u => (
                          <tr key={u.id} class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4 font-medium text-gray-900">{u.name}</td>
                            <td class="px-6 py-4 text-gray-600">{u.email}</td>
                            <td class="px-6 py-4">
                              <span class={`px-2 py-0.5 rounded text-xs font-semibold capitalize ${
                                u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700'
                              }`}>
                                {u.role}
                              </span>
                            </td>
                            <td class="px-6 py-4 text-gray-600">
                              {tasks.filter(t => t.assignedTo === u.id).length} tasks
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </main>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
